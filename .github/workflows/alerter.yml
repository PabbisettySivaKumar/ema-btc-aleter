name: price-alerter

on:
  # Triggered every 15 min by an external cron-job.org POST to GitHub's
  # workflow-dispatch API. GitHub's own `schedule` cron was unreliable — it
  # throttled/dropped ~80% of runs — so we drive the cadence externally.
  workflow_dispatch:   # manual trigger + external cron-job.org trigger

# cancel-in-progress: true so a new 15-min trigger supersedes any earlier run
# that is still queued/running. Previously this was false, which meant a single
# run stuck in "queued" (a transient GitHub runner hiccup) held the group
# forever and every later run queued behind it got cancelled — a one-off hiccup
# turned into a multi-hour outage. With true, the newest trigger always wins.
concurrency:
  group: alerter
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step can never linger and block later runs.
    # A normal cycle finishes in well under a minute.
    timeout-minutes: 8
    permissions:
      contents: write   # allow committing the signal-portfolio state back on each crossover

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price alerter (one cycle)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Dead-man's switch: base ping URL of a healthchecks.io check.
          # If unset, the heartbeat is silently skipped (alerter still runs).
          HEARTBEAT_URL:      ${{ secrets.HEARTBEAT_URL }}
        run: python live/price_alert.py --once

      - name: Persist signal-portfolio state (on init / each crossover)
        run: |
          if [ -n "$(git status --porcelain -- live/trade_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live/trade_state.json
            git commit -m "state: signal portfolio [skip ci]"
            git push origin HEAD:main
          fi
